[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elementary-backend"
version = "0.1.0"
description = "FastAPI backend for Elementary"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn>=0.41,<1.0",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.18,<2.0",
    "psycopg[binary]>=3.3,<4.0",
    "PyJWT[crypto]>=2.15.1,<3.0",
    "python-dotenv>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "httpx>=0.28,<0.29",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
